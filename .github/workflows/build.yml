name: Build Custom mkcert
on:
  push:
    branches: [ master ]
workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build Windows amd64 exe
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "-X main.Version=custom-mkcert-wx" -o mkcert.exe .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-mkcert
          path: mkcert.exe
