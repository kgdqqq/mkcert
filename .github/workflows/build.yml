name: Build Custom mkcert
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: mkcert.exe
            artifact: mkcert-windows-amd64
          - goos: linux
            goarch: amd64
            output: mkcert-linux-amd64
            artifact: mkcert-linux-amd64
          - goos: darwin
            goarch: amd64
            output: mkcert-macos-amd64
            artifact: mkcert-macos-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build ${{ matrix.artifact }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-X main.Version=custom-mkcert-wx" -o ${{ matrix.output }} .

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
